name: a1-hunger-coupling
stage: A1

# Follow-up to a1-patchiness, which found `directed_foraging` robustly NEGATIVE —
# hungry agents were less path-straight than sated ones in 30 runs out of 30.
#
# Hypothesis for that result: the effect is produced by the policy, not by
# selection. `s0_reactive.choose_action` weighs the resource gradient
# `sated_gradient_factor` times less when an agent is sated, so hungry agents
# steer by a noisy local gradient (wiggly) while sated agents coast on heading
# persistence (straight). If that is the whole story, then setting the factor to
# 1.0 — hunger no longer changes gradient weight — should collapse the effect
# toward zero.
#
# Prediction:
#   0.25 (current default) → strongly negative
#   0.50                   → about half as negative
#   1.00 (no coupling)     → near zero
#
# If the effect survives at 1.0, the explanation is wrong and something in the
# world — not the policy — is making hungry agents turn more.
#
# Patchiness is held at 0.6: mid-range, and the point where a1-patchiness showed
# a large sample size with worlds not yet saturated.

seeds: [0, 1, 2]

sweep:
  intelligence.sated_gradient_factor: [0.25, 0.5, 1.0]

base:
  world:
    grid: 64
    patchiness: 0.6
    regrowth: 0.05
    seed_rain: 0.004
    resource_capacity: 1.0

  primitives:
    p1: { level: 0 }
    p10: { level: 0, rate: 0.0 }

  intelligence:
    stage: S0
    genome_size: 8
    view_radius: 2

  population:
    initial: 120
    capacity: 500
    mutation_rate: 0.02
    mutation_scale: 0.05
    birth_cap: 32

  agent:
    metabolism: 0.5
    max_age: 400
    birth_energy: 20.0
    gather_efficiency: 4.0
    start_energy: 50.0

  run:
    worlds: 16
    ticks: 15000
    checkpoint_every: 15000
    aggregate_every: 50
    log_tier: sampled
    sample_rate: 32
    shard_ticks: 5000
