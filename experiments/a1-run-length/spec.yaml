# a1-run-length — the design that was NOT run, and why it is kept
#
# ABANDONED ON COST. The question — is A1's negative dose-response an artifact of
# observation length? — was answered instead by re-scoring A1's committed runs at
# four observation windows, paired within run. See analyse.py and result.md.
#
# This file is kept because the reason it was abandoned is itself the finding.
#
# The plan was to re-run a1-gradient-ascent's config at 30,000 ticks. Setting the
# population ceiling took four attempts, each one a headroom precheck (D-065)
# refusing to start:
#
#     capacity  900  ->  worst world mean  900 (100%)   A1's own setting
#     capacity 1800  ->  worst world mean 1743  (97%)   the first suggestion
#     capacity 2400  ->  worst world mean 2226  (93%)   after an equilibrium probe
#     capacity 9000  ->  ~5 hours of compute, so: no
#
# Two things that cost is made of, both worth knowing:
#
# 1. At patchiness 0.0 — uniform resources, no patches — the world's carrying
#    capacity over 30,000 ticks is far larger than anything A1 measured at 15,000.
#    A1's own configuration cannot be run to twice its length without the array
#    becoming the regulator.
#
# 2. A 4-world pilot is a weak estimate of a distribution whose worlds span ten to
#    one. An "unconstrained" probe at capacity 5000 reported world means of
#    1137 / 976 / 310 at patchiness 0.0 / 0.4 / 1.0 — and then capacity 2400 pinned
#    at 2226, because changing capacity changes the founding draws and therefore
#    re-rolls which four worlds the pilot sees. The precheck's own docstring says
#    it underestimates the maximum; that caveat is load-bearing, not decorative.
#
# Cost scales as worlds x capacity x ticks, so a ceiling set by the most explosive
# point in a sweep is paid for at every point in it.
name: a1-run-length
stage: A2
seeds:
- 0
- 1
- 2
sweep:
  world.patchiness:
  - 0.0
  - 0.4
  - 1.0
base:
  world:
    grid: 64
    regrowth: 0.05
    seed_rain: 0.004
    resource_capacity: 1.0
  primitives:
    p1:
      level: 0
    p10:
      level: 0
      rate: 0.0
  intelligence:
    stage: S0
    genome_size: 8
    view_radius: 2
    sated_gradient_factor: 0.25
  population:
    initial: 120
    capacity: 2400
    mutation_rate: 0.02
    mutation_scale: 0.05
    birth_cap: 32
  agent:
    metabolism: 0.5
    max_age: 400
    birth_energy: 20.0
    gather_efficiency: 4.0
    start_energy: 50.0
  run:
    worlds: 16
    ticks: 30000
    checkpoint_every: 1000000000
    aggregate_every: 50
    log_tier: sampled
    sample_rate: 32
    shard_ticks: 5000
