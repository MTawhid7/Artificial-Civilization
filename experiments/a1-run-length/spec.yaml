# a1-run-length — is A1's negative dose-response an artifact of observation length?
#
# A2 measured between-world divergence still climbing at year 2,500, while every
# A1 result was scored at 15,000 ticks. That makes "was the negative result simply
# length-limited?" a live question about a conclusion already committed.
#
# The design is a PAIRED comparison inside one run, not two runs of different
# lengths: `gradient_ascent` takes `max_tick`, so each run is scored twice — once
# truncated at 15k and once at the full 30k. Same worlds, same seeds, same
# landscapes; only the observation window differs.
#
# capacity 2400 was set by the headroom precheck, not by guessing (D-065). A1's
# own capacity of 900 pins at 100% when run to 30k ticks, and 1800 still pins at
# 97% — the unconstrained equilibrium probe measured world means of 1137 / 976 /
# 310 at patchiness 0.0 / 0.4 / 1.0, peaking at 1783. Everything else is A1's
# a1-gradient-ascent config unchanged.
name: a1-run-length
stage: A2
seeds:
- 0
- 1
- 2
sweep:
  world.patchiness:
  - 0.0
  - 0.4
  - 1.0
base:
  world:
    grid: 64
    regrowth: 0.05
    seed_rain: 0.004
    resource_capacity: 1.0
  primitives:
    p1:
      level: 0
    p10:
      level: 0
      rate: 0.0
  intelligence:
    stage: S0
    genome_size: 8
    view_radius: 2
    sated_gradient_factor: 0.25
  population:
    initial: 120
    capacity: 2400
    mutation_rate: 0.02
    mutation_scale: 0.05
    birth_cap: 32
  agent:
    metabolism: 0.5
    max_age: 400
    birth_energy: 20.0
    gather_efficiency: 4.0
    start_energy: 50.0
  run:
    worlds: 16
    ticks: 30000
    checkpoint_every: 1000000000
    aggregate_every: 50
    log_tier: sampled
    sample_rate: 32
    shard_ticks: 5000
