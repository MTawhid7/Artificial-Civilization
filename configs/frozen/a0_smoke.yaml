# A0 smoke config — the shape the ship criteria are measured against.
#
# 32 worlds x 1,000 agents x 50k ticks. See docs/00-feasibility.md for the
# measured results and docs/10-roadmap.md#a0--skeleton for what they gate.
#
# NOTE: this config runs at array capacity on purpose — measured mean population
# is 937 of 1,000. That makes it a deliberate worst case for throughput, which is
# what A0 is measuring, and it means the timings here are an upper bound: a world
# in the viable band has fewer agents and ticks faster.
#
# It is therefore NOT a config to draw conclusions from. A population pinned
# against the array ceiling is regulated by the array, not by the world.
# For a viable-band configuration see experiments/a1-patchiness/spec.yaml.

world:
  grid: 96
  patchiness: 0.5
  regrowth: 0.05
  seed_rain: 0.004      # recolonization; without it zero is absorbing (D-051)
  resource_capacity: 1.0

primitives:
  p1: { level: 0 }
  p10: { level: 0, rate: 0.0 }   # drift off at A0; A1 turns it on

intelligence:
  stage: S0
  genome_size: 8
  view_radius: 2

population:
  initial: 200
  capacity: 1000
  mutation_rate: 0.02
  mutation_scale: 0.05

agent:
  metabolism: 0.5
  max_age: 400          # ~33 years at 1 tick/month
  birth_energy: 20.0
  gather_efficiency: 4.0
  start_energy: 50.0

run:
  worlds: 32
  ticks: 50000
  checkpoint_every: 2000
  aggregate_every: 100
  log_tier: sampled
  sample_rate: 64
  shard_ticks: 5000
