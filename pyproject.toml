[project]
name = "artificial-civilization"
version = "0.1.0"
description = "A comparative history laboratory: thousands of divergent histories from controlled initial conditions."
readme = "README.md"
requires-python = ">=3.13,<3.14"

# Pinned by uv.lock, which is committed. Determinism is version-sensitive —
# see docs/11-engineering.md, determinism rule 5.
dependencies = [
    "numpy>=2.2,<3",
    "pyarrow>=23.0.1,<24",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Analysis and plotting. Deliberately NOT core dependencies: nothing under
# src/core/ may import these.
analysis = [
    "duckdb>=1.1,<2",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

# The Historian's SDK. A *group*, not an extra, and that is deliberate: CI runs
# `uv sync --all-extras`, which installs extras and leaves groups alone. The
# determinism gate must never need a network SDK — every test runs against
# `historian.client.ReplayClient` — so this is installed only when someone is
# actually generating prose:
#
#     uv sync --group historian
#
# D-067: gemini-3.7-flash. See src/historian/client.py for why the model choice
# is safe here in a way it would be nowhere else in this project.
historian = [
    # >= 2.0 is a hard floor, not caution. The Interactions API rejects the 1.x
    # request schema outright — "the legacy Interactions API schema is no longer
    # supported", HTTP 400 — so a 1.x install fails on the first live call and
    # passes every test, because every test replays fixtures.
    "google-genai>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/chronicle", "src/lens", "src/forge", "src/digest",
            "src/historian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `tools/` is importable: the renderer is a consumer of the digest
# contract and gets tested like one.
pythonpath = ["src", "."]
